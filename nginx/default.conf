server {
    listen 80;
    server_name localhost;

    # Peticiones a /api las manda a Symfony (PHP-FPM)
    location ^~ /api {
        try_files $uri /index.php$is_args$args;

        # Todas las peticiones PHP pasan a PHP-FPM
        location ~ ^/api(/.*)?\.php$ {
            fastcgi_pass backend:9000;
            fastcgi_split_path_info ^(.+\.php)(/.*)$;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /app/public$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
        }

        # Si no es PHP, lo pasa a index.php para routing de Symfony
        location ~ ^/api(/|$) {
            fastcgi_pass backend:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /app/public/index.php;
            fastcgi_param PATH_INFO $fastcgi_path_info;
        }
    }

    # Todo lo demás (SPA) va al frontend (Vite)
    location / {
        proxy_pass http://frontend:5173;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        try_files $uri $uri/ /index.html =404;
    }

    # Seguridad: bloquea archivos ocultos
    location ~ /\. {
        deny all;
    }
}